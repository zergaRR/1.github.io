# Локальный PostgreSQL для разработки академии.
# Запуск:  docker compose up -d
# Данные сохраняются в volume pgdata. Удаление: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    container_name: apex-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
